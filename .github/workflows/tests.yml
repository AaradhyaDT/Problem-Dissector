name: Tests

on:
  push:
    paths: ["cli/**", "dissector/**", "tests/**", "scripts/**", "skills/**", "pyproject.toml", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["cli/**", "dissector/**", "tests/**", "scripts/**", "skills/**", "pyproject.toml", ".github/workflows/tests.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  # The full archive is private. Run scripts/evaluate_archive.py locally with
  # an authorized checkout; never expose archive credentials in public CI.
