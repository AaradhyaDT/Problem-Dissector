[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "problem-dissector"
version = "0.3.0"
description = "Heuristic algorithmic problem dissection for competitive programming"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Aaradhya Dev Tamrakar" }
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
problem-dissector = "cli.dissect:main"
problem-dissector-evaluate-archive = "scripts.evaluate_archive:main"

[tool.setuptools]
packages = ["dissector", "dissector.adapters", "cli", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
